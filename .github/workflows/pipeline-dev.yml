name: lp-pedidos-dev-pipeline

on:
  push:
    branches:
      - develop

jobs:
  build-scan-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Cache SonarCloud packages
        uses: actions/cache@v3
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Ensure Maven Wrapper is executable
        run: chmod +x mvnw
      - name: Checkstyle Validation
        run: ./mvnw checkstyle:check -B
      - name: Maven Build, SonarQube Scan & Quality Gate
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: ./mvnw clean verify org.sonarsource.scanner.maven:sonar-maven-plugin:sonar -Dsonar.host.url=https://sonarcloud.io -Dsonar.qualitygate.wait=true -DskipTests -B

      - name: Docker Build
        run: docker build -t jfrog.liverpool.com.mx/lp-pedidos/app:dev-${{ github.sha }} .
      - name: Docker Push to JFrog
        run: |
          echo "${{ secrets.JFROG_TOKEN }}" | docker login jfrog.liverpool.com.mx -u ${{ secrets.JFROG_USER }} --password-stdin
          docker push jfrog.liverpool.com.mx/lp-pedidos/app:dev-${{ github.sha }}