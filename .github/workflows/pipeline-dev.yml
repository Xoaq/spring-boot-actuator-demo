name: lp-pedidos-dev-pipeline

on:
  push:
    branches:
      - develop

jobs:
  build-scan-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Cache SonarCloud packages
        uses: actions/cache@v3
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Ensure Maven Wrapper is executable
        run: chmod +x mvnw
      - name: Checkstyle Validation
        continue-on-error: true
        run: ./mvnw checkstyle:check -B
      - name: Maven Build
        run: ./mvnw clean package -DskipTests -B
      - name: SonarQube Scan & Quality Gate
        continue-on-error: true
        run: ./mvnw sonar:sonar -Dsonar.projectKey=Xoaq_spring-boot-actuator-demo -Dsonar.organization=xoaq -Dsonar.host.url=https://sonarcloud.io -Dsonar.token=${{ secrets.SONAR_TOKEN }} -Dsonar.qualitygate.wait=true

      - name: Docker Build
        run: docker build -t jfrog.liverpool.com.mx/lp-pedidos/app:dev-${{ github.sha }} .
      - name: Docker Push to JFrog
        continue-on-error: true
        run: |
          echo "${{ secrets.JFROG_TOKEN }}" | docker login jfrog.liverpool.com.mx -u ${{ secrets.JFROG_USER }} --password-stdin
          docker push jfrog.liverpool.com.mx/lp-pedidos/app:dev-${{ github.sha }}