services:
  # --- Aplicación Spring Boot ---
  app-pedidos:
    build: 
      context: ..
      dockerfile: deploy/Dockerfile 
    container_name: lp-pedidos-app
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      - MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE=prometheus,health,info
    networks:
      - liverpool-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # --- Prometheus (Recolección de métricas) ---
  prometheus:
    image: prom/prometheus:latest
    container_name: lp-prometheus
    volumes:
      - ../src/main/resources/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9091:9090"
    networks:
      - liverpool-net

  # --- Grafana (Visualización) ---
  grafana:
    image: grafana/grafana:latest
    container_name: lp-grafana
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin # Solo para fines de la demo técnica
    networks:
      - liverpool-net
    depends_on:
      - prometheus

networks:
  liverpool-net:
    driver: bridge