name: lp-pedidos-dev-pipeline

on:
  push:
    branches:
      - develop

jobs:
  build-scan-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Ensure Maven Wrapper is executable
        run: chmod +x mvnw
      - name: Checkstyle Validation
        run: ./mvnw checkstyle:check -B
      - name: Maven Full Build
        run: ./mvnw clean package -DskipTests -B
      - name: SonarQube Scan & Quality Gate
        run: ./mvnw sonar:sonar -Dsonar.projectKey=lp-pedidos -Dsonar.login=${{ secrets.SONAR_TOKEN }} -Dsonar.qualitygate.wait=true

      - name: Docker Build
        run: docker build -t jfrog.liverpool.com.mx/lp-pedidos/app:dev-${{ github.sha }} .
      - name: Docker Push to JFrog
        run: |
          echo "${{ secrets.JFROG_TOKEN }}" | docker login jfrog.liverpool.com.mx -u ${{ secrets.JFROG_USER }} --password-stdin
          docker push jfrog.liverpool.com.mx/lp-pedidos/app:dev-${{ github.sha }}