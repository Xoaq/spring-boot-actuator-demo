name: lp-pedidos-prod-pipeline

on:
  push:
    branches:
      - main
      - master

jobs:
  infra-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: TFSEC Security Scanner
        uses: aquasecurity/tfsec-action@v1.0.0
        with:
          working_directory: .

  deploy-prod:
    needs: infra-validation
    runs-on: ubuntu-latest
    # TODO: Descomentar environment para requerir aprobación manual en GitHub Environments
    # environment: production
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v3
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
      # Fix: Se aumenta timeout para el healthcheck de ECS (controlado via variables en apply)
      - name: Terraform Init & Plan (Simulated Apply)
        continue-on-error: true
        run: |
          terraform init
          terraform plan -var="environment=prod" -var="ecs_task_cpu=2048" -var="ecs_task_memory=4096"