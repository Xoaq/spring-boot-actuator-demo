name: lp-pedidos-feature-pipeline

on:
  push:
    branches:
      - 'feature/*'

jobs:
  quality-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0  # Importante para que Sonar compare con la rama base

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven' # Agregamos cache para que sea más rápido tras la primera corrida

      - name: Cache SonarCloud packages
        uses: actions/cache@v3
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Static Code Analysis (SonarQube)
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: mvn verify sonar:sonar -Dsonar.qualitygate.wait=true

      - name: Maven Build & Unit Tests
        # Si el análisis de Sonar falla por el Quality Gate, este paso no se ejecutará
        #Actualizando  sonar token
        # dando permisos... desde sonarcloud project permissions..
        # actualizando token en secrets de github
        run: mvn clean test -B -T 1C